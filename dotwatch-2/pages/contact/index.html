<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماس با ما | دات واچ</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div style="background:var(--secondary);color:white;padding:15px 0;">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
            <a href="../../index.html" class="logo" style="display:flex;align-items:center;gap:10px;">
                <div class="logo-icon" style="width:40px;height:40px;font-size:18px;"><i class="fas fa-clock"></i></div>
                <div class="logo-text" style="font-size:20px;color:white;">دات<span style="color:var(--primary-light);">واچ</span></div>
            </a>
        </div>
    </div>
    <div class="page-header">
        <div class="container">
            <h1>تماس با ما</h1>
            <div class="breadcrumb">
                <a href="../../index.html">صفحه اصلی</a>
                <span>/</span>
                <span>تماس با ما</span>
            </div>
        </div>
    </div>
    <div class="container" style="padding:60px 20px;max-width:1000px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;">
            <div>
                <h2 style="color:var(--secondary);margin-bottom:20px;">اطلاعات تماس</h2>
                <p style="margin-bottom:15px;display:flex;align-items:center;gap:10px;"><i class="fas fa-map-marker-alt" style="color:var(--primary);width:20px;"></i> تهران</p>
                <p style="margin-bottom:15px;display:flex;align-items:center;gap:10px;"><i class="fas fa-phone" style="color:var(--primary);width:20px;"></i> 021-91008090</p>
                <p style="margin-bottom:15px;display:flex;align-items:center;gap:10px;"><i class="fas fa-envelope" style="color:var(--primary);width:20px;"></i> info@dotwatch.ir</p>
                <div style="margin-top:30px;">
                    <h3 style="margin-bottom:15px;">شبکه‌های اجتماعی</h3>
                    <div style="display:flex;gap:10px;">
                        <a href="#" style="width:40px;height:40px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;"><i class="fab fa-instagram"></i></a>
                        <a href="#" style="width:40px;height:40px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;"><i class="fab fa-telegram"></i></a>
                    </div>
                </div>
            </div>
            <div style="background:white;padding:30px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05);">
                <h3 style="margin-bottom:20px;">فرم تماس</h3>
                <form onsubmit="event.preventDefault();showNotification('پیام شما ارسال شد');this.reset();">
                    <div class="form-group"><label>نام و نام خانوادگی</label><input type="text" required></div>
                    <div class="form-group"><label>ایمیل</label><input type="email" required></div>
                    <div class="form-group"><label>موضوع</label><input type="text" required></div>
                    <div class="form-group"><label>پیام</label><textarea rows="4" required></textarea></div>
                    <button type="submit" class="btn btn-primary" style="width:100%;">ارسال پیام</button>
                </form>
            </div>
        </div>
    </div>
    <script src="../../js/main.js"></script>
</body>
</html>
