<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تکمیل خرید | دات واچ</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div style="background:var(--secondary);color:white;padding:15px 0;">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
            <a href="../index.html" class="logo" style="display:flex;align-items:center;gap:10px;">
                <div class="logo-icon" style="width:40px;height:40px;font-size:18px;"><i class="fas fa-clock"></i></div>
                <div class="logo-text" style="font-size:20px;color:white;">دات<span style="color:var(--primary-light);">واچ</span></div>
            </a>
        </div>
    </div>
    <div class="checkout-layout container">
        <div class="checkout-form">
            <h2 style="margin-bottom:25px;">اطلاعات ارسال</h2>
            <form id="checkout-form">
                <div class="form-row">
                    <div class="form-group"><label>نام و نام خانوادگی *</label><input type="text" name="name" required></div>
                    <div class="form-group"><label>شماره موبایل *</label><input type="tel" name="phone" required></div>
                </div>
                <div class="form-group"><label>آدرس کامل *</label><textarea name="address" rows="3" required></textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>کد پستی</label><input type="text" name="postal"></div>
                    <div class="form-group"><label>شهر</label><input type="text" name="city" value="تهران"></div>
                </div>
                <h3 style="margin:30px 0 20px;">روش پرداخت</h3>
                <div class="payment-methods">
                    <label class="payment-method selected">
                        <input type="radio" name="payment" value="online" checked>
                        <i class="fas fa-credit-card"></i>
                        <div><strong>پرداخت آنلاین</strong><p style="font-size:13px;color:var(--gray-500);">پرداخت امن از درگاه بانکی</p></div>
                    </label>
                    <label class="payment-method">
                        <input type="radio" name="payment" value="cod">
                        <i class="fas fa-money-bill-wave"></i>
                        <div><strong>پرداخت در محل</strong><p style="font-size:13px;color:var(--gray-500);">پرداخت هنگام دریافت کالا</p></div>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:30px;">ثبت سفارش</button>
            </form>
        </div>
        <div class="cart-summary" id="checkout-summary"></div>
    </div>
    <script src="../js/main.js"></script>
</body>
</html>
