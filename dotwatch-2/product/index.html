<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات محصول | دات واچ</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div style="background:var(--secondary);color:white;padding:15px 0;">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
            <a href="../index.html" class="logo" style="display:flex;align-items:center;gap:10px;">
                <div class="logo-icon" style="width:40px;height:40px;font-size:18px;"><i class="fas fa-clock"></i></div>
                <div class="logo-text" style="font-size:20px;color:white;">دات<span style="color:var(--primary-light);">واچ</span></div>
            </a>
            <div class="header-actions" style="display:flex;gap:20px;">
                <a href="../cart/index.html" style="color:white;position:relative;"><i class="fas fa-shopping-cart"></i> <span class="cart-count" style="display:none;">0</span></a>
            </div>
        </div>
    </div>
    <div class="product-detail container">
        <div class="detail-layout" id="product-detail">
            <div>
                <div class="gallery-main"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f1f3f5,#e9ecef);color:#adb5bd;font-size:80px;"><i class="fas fa-clock"></i></div></div>
                <div class="gallery-thumbs">
                    <div class="gallery-thumb active"><i class="fas fa-clock" style="color:#adb5bd;"></i></div>
                    <div class="gallery-thumb"><i class="fas fa-clock" style="color:#adb5bd;"></i></div>
                </div>
            </div>
            <div class="detail-info">
                <div class="detail-brand" id="detail-brand">...</div>
                <h1 id="detail-name">در حال بارگذاری...</h1>
                <div class="detail-rating" id="detail-rating">...</div>
                <div class="detail-price" id="detail-price">...</div>
                <div class="detail-actions">
                    <div class="quantity-selector">
                        <button id="qty-minus">-</button>
                        <input type="text" id="qty-input" value="1" readonly>
                        <button id="qty-plus">+</button>
                    </div>
                    <button class="btn btn-primary btn-lg" id="add-to-cart-btn"><i class="fas fa-shopping-cart"></i> افزودن به سبد خرید</button>
                    <button class="btn btn-outline" onclick="toggleWishlist(parseInt(new URLSearchParams(location.search).get('id')))"><i class="fas fa-heart"></i></button>
                </div>
                <div class="detail-features" id="detail-features"></div>
                <p id="detail-desc" style="color:var(--gray-600);line-height:1.8;"></p>
            </div>
        </div>
        <div class="tabs-nav">
            <button class="tab-btn active">مشخصات فنی</button>
            <button class="tab-btn">نقد و بررسی</button>
            <button class="tab-btn">نظرات کاربران</button>
        </div>
        <div class="tab-content active">
            <table class="specs-table" id="specs-table"></table>
        </div>
        <div class="tab-content"><p style="padding:20px;color:var(--gray-500);">نقد و بررسی تخصصی این محصول به زودی منتشر خواهد شد.</p></div>
        <div class="tab-content"><p style="padding:20px;color:var(--gray-500);">اولین نفری باشید که نظر می‌دهید.</p></div>
        <div style="margin-top:60px;">
            <div class="section-header"><h2 class="section-title">محصولات مرتبط</h2></div>
            <div id="related-products" class="products-grid"></div>
        </div>
    </div>
    <script src="../js/main.js"></script>
</body>
</html>
